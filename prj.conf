# Logging
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Memory Config
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Enable the ExecuTorch Module
CONFIG_EXECUTORCH=y
# Enable floating-point formatting for printk
CONFIG_CBPRINTF_FP_SUPPORT=y